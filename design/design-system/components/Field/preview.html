<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Field</title>
<style>
  body { padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .narrow { max-width: 420px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .muted { color: var(--ink-soft); font-size: 13px; margin: 4px 0 0; }
  .icons { display: flex; flex-wrap: wrap; gap: 8px; }
  .ic { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; font-size: 12px; color: var(--ink-soft); }
  .ic svg { color: var(--ink); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var C = window.ComproYa, h = React.createElement;
  var SAMPLE_IMG = "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23ffffff'/%3E%3Crect x='30' y='52' width='140' height='84' rx='4' fill='%23171717'/%3E%3Crect x='36' y='58' width='128' height='72' fill='%23163d6d'/%3E%3Crect x='92' y='136' width='16' height='14' fill='%236b6b6b'/%3E%3Crect x='70' y='150' width='60' height='6' rx='3' fill='%236b6b6b'/%3E%3C/svg%3E";
  var D = h('div', { className: 'grid2' },
    h('div', null,
      h(C.Field, { label: 'Correo electrónico', type: 'email', defaultValue: 'duvan@correo.com' }),
      h(C.Field, { label: 'Contraseña', type: 'password', hint: 'Mínimo 8 caracteres.' })),
    h('div', null,
      h(C.Field, { label: 'Documento de identidad', defaultValue: '1012345678', error: 'Ya hay una cuenta con ese documento. ¿Quieres iniciar sesión?' }),
      h(C.Field, { as: 'select', label: 'Sucursal de retiro', options: [
        { value: '2', label: 'ComproYa Barranquilla, Barranquilla' },
        { value: '6', label: 'ComproYa Chapinero, Bogotá' },
        { value: '1', label: 'ComproYa Cali Sur, Cali (sin retiro por ahora)', disabled: true }] })));
  ReactDOM.createRoot(document.getElementById('root')).render(typeof D === 'function' ? h(D) : D);
</script>
</body>
</html>
