<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página de categoría</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/comproya/tokens.css">
<link rel="stylesheet" href="ds/comproya/components/bundle.css">
<link rel="stylesheet" href="screens.css">
<script src="ds/comproya/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="pg" style="font-family: var(--font-sans); color: var(--ink);">
  <x-import component-from-global-scope="ComproYa.ShopHeader" logo-src="/_blob/cb12035d6620475dd0d805671b129f77" active="catalogo" cart-count="{{two}}" cart-total="{{cartTotal}}"></x-import>

  <main>
    <div class="wrap" style="padding-top: 16px;">
      <x-import component-from-global-scope="ComproYa.Breadcrumbs" items="{{crumbs}}"></x-import>
    </div>

    <section class="wrap" style="padding-top: 12px;" aria-labelledby="cat-title">
      <div class="cover">
        <div class="cover-copy">
          <span class="cover-count"><x-import component-from-global-scope="ComproYa.Icon" name="grid" size="{{smallIcon}}"></x-import>{{countLabel}}</span>
          <h1 id="cat-title" class="h-display" style="color: #ffffff;">{{cat.name}}</h1>
          <p>{{cat.description}}</p>
        </div>
        <div class="cover-img"><img src="{{cat.image}}" alt=""></div>
      </div>
    </section>

    <section class="wrap sec" aria-label="Otras categorías">
      <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
        <h2 class="h-sec" style="margin-bottom: 12px;">Explora otras categorías</h2>
        <x-import component-from-global-scope="ComproYa.Skeleton" variant="category" count="{{eight}}" label="Cargando categorías…"></x-import>
      </sc-if>
      <sc-if value="{{notLoading}}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="ComproYa.CategoryCarousel" categories="{{categories}}" title="Explora otras categorías"></x-import>
      </sc-if>
    </section>

    <section class="wrap sec" aria-labelledby="cat-products">
      <div class="toolbar">
        <h2 id="cat-products" class="h-sec">Productos de {{cat.name}}</h2>
        <p class="small muted">{{showingLabel}}</p>
      </div>
      <div style="padding-top: 16px;">
        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="ComproYa.Skeleton" variant="product-card" count="{{ten}}" label="Cargando productos…"></x-import>
        </sc-if>
        <sc-if value="{{notLoading}}" hint-placeholder-val="{{ true }}">
          <div class="grid-products">
            <sc-for list="{{products}}" as="p" hint-placeholder-count="10">
              <x-import component-from-global-scope="ComproYa.ProductCard" name="{{p.name}}" category="{{p.category}}" price="{{p.price}}" units="{{p.units}}" image="{{p.image}}" href="Producto.dc.html"></x-import>
            </sc-for>
          </div>
          <sc-if value="{{few}}" hint-placeholder-val="{{ false }}">
            <div class="loyalty" style="margin-top: 24px; background: var(--orange-100); color: var(--ink);">
              <span class="loyalty-ic" style="color: var(--orange-600);"><x-import component-from-global-scope="ComproYa.Icon" name="grid" size="{{bigIcon}}"></x-import></span>
              <div style="flex: 1; min-width: 220px;">
                <strong style="font-size: 16px;">Viste todos los productos de {{cat.name}}</strong>
                <p class="small">Sigue explorando en otras categorías o vuelve al catálogo completo.</p>
              </div>
              <x-import component-from-global-scope="ComproYa.Button" variant="secondary" href="Main.dc.html" icon="arrow-left">Volver al catálogo</x-import>
            </div>
          </sc-if>
          <sc-if value="{{many}}" hint-placeholder-val="{{ true }}">
            <div class="more">
              <x-import component-from-global-scope="ComproYa.Button" variant="secondary" icon-right="chevron-down">Ver más productos</x-import>
              <p class="small muted">{{showingLabel}}</p>
            </div>
          </sc-if>
        </sc-if>
      </div>
    </section>
  </main>

  <x-import component-from-global-scope="ComproYa.AcademicFooter" logo-src="/_blob/62890316f6f271cb48ed2a63a9067e57"></x-import>
</div>
</x-dc>

</body>
</html>
