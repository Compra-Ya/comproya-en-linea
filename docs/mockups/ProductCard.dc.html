<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,-apple-system,sans-serif;color:#16202B}
a{color:#17457F;text-decoration:none}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid #E6E9ED;border-radius:14px;overflow:hidden;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease" style-hover="border-color:#F0C7A9;transform:translateY(-2px);box-shadow:0 12px 26px rgba(16,32,48,.08)">
  <a href="#" aria-label="{{ p.name }}" style="position:absolute;inset:0;z-index:1"></a>
  <div style="position:relative;aspect-ratio:1/1;background:#F4F6F8;background-image:repeating-linear-gradient(135deg,rgba(23,69,127,.07) 0 8px,rgba(23,69,127,0) 8px 16px);display:flex;align-items:center;justify-content:center">
    <span style="font:500 9px/1 ui-monospace,Menlo,monospace;color:#8B98A5;letter-spacing:.06em">{{ p.imgLabel }}</span>
    <sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute;top:10px;left:10px;background:#E8681C;color:#fff;font:800 11px/1 'Manrope',sans-serif;padding:5px 8px;border-radius:6px">-{{ p.discountPct }}%</span>
    </sc-if>
  </div>
  <button type="button" aria-label="Agregar al carrito" style="position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:999px;border:1px solid #E6E9ED;background:#fff;color:#17457F;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;box-shadow:0 4px 10px rgba(16,32,48,.08)" style-hover="background:#E8681C;border-color:#E8681C;color:#fff">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
  </button>
  <div style="display:flex;flex-direction:column;gap:6px;padding:14px">
    <span style="font:600 10px/1 'Manrope',sans-serif;text-transform:uppercase;letter-spacing:.07em;color:#8B98A5">{{ p.brand }}</span>
    <span style="font:600 13px/1.35 'Manrope',sans-serif;color:#16202B;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:35px">{{ p.name }}</span>
    <span style="display:flex;align-items:center;gap:5px">
      <span style="font:500 11px/1 'Manrope',sans-serif;color:#E8681C">★★★★☆</span>
      <span style="font:500 10.5px/1 'Manrope',sans-serif;color:#8B98A5">{{ p.reviews }}</span>
    </span>
    <span style="display:flex;align-items:baseline;gap:7px;margin-top:2px">
      <span style="font:800 17px/1 'Manrope',sans-serif;color:#16202B;letter-spacing:-.01em">{{ p.price }}</span>
      <sc-if value="{{ p.hasDiscount }}" hint-placeholder-val="{{ true }}">
        <span style="font:500 11.5px/1 'Manrope',sans-serif;color:#8B98A5;text-decoration:line-through">{{ p.oldPrice }}</span>
      </sc-if>
    </span>
    <sc-if value="{{ p.pickupTag }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:center;gap:6px;margin-top:2px">
        <span style="width:6px;height:6px;border-radius:999px;background:#1E8E5A;display:block;flex:none"></span>
        <span style="font:600 10.5px/1.3 'Manrope',sans-serif;color:#1E8E5A">{{ p.pickupTag }}</span>
      </span>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"p":{"editor":null,"default":{"imgLabel":"FOTO 320×320","brand":"Marca homologada","name":"Nombre del producto homologado, texto de ejemplo","reviews":"(128)","price":"$129.900","oldPrice":"$179.900","hasDiscount":true,"discountPct":"28","pickupTag":"Retiro hoy en sucursal Chapinero"}}}'>
class Component extends DCLogic {
  renderVals() {
    return { p: this.props.p ?? {} };
  }
}
</script>
</body>
</html>
