# Compilación del frontend en Cloud Build con la URL del backend incrustada (NEXT_PUBLIC_API_URL).
# Uso (docs/despliegue-gcp.md, sección 6):
#   gcloud builds submit frontend/ --config frontend/cloudbuild.yaml \
#     --substitutions _API_URL=https://<backend>.run.app/api,_IMAGE=<región>-docker.pkg.dev/<proyecto>/comproya/frontend:manual
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "NEXT_PUBLIC_API_URL=${_API_URL}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
